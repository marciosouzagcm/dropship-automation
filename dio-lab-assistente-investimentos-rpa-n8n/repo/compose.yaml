services:
  docs:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/data.csv || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"
      # O runner do nó Code resolve localhost para ::1, mas o broker escuta só em IPv4.
      NODE_OPTIONS: --dns-result-order=ipv4first
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5678/healthz', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  rpa:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      URL_PAGINA: ${URL_PAGINA:-http://docs/}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/clientes}
    depends_on:
      n8n:
        condition: service_healthy
      docs:
        condition: service_healthy

volumes:
  n8n_data: